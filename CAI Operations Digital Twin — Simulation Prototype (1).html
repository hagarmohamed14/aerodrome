<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CAI Operations Digital Twin — Simulation Prototype</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--p:#111b2e;--p2:#16233a;--ln:#243452;--tx:#e8eef8;--mu:#8fa1bf;--ac:#3b82f6;--ok:#10b981;--wn:#f59e0b;--cr:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:230px 1fr 310px;grid-template-rows:auto 1fr auto;height:100%}
header{grid-column:1/4;background:linear-gradient(90deg,#0b1220ee,#0b122099),var(--hero) center/cover;border-bottom:1px solid var(--ln);padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0}header small{color:var(--mu)}
nav{background:var(--p);border-right:1px solid var(--ln);overflow:auto;padding:6px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:5px 8px;border-radius:5px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}nav button:hover{background:var(--p2)}nav button.na{opacity:.45}
main{overflow:auto;padding:12px}aside{background:var(--p);border-left:1px solid var(--ln);overflow:auto;padding:12px}
.g{display:grid;gap:10px}.k{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:10px;min-width:0}.card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.kv b{display:block;font-size:22px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:4px 6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500}tr.r{cursor:pointer}tr.r:hover,tr.sel{background:var(--p2)}
.b{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:#33415d}.ok{background:#064e3b}.wn{background:#78350f}.cr{background:#7f1d1d}
button.a,select,input{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:5px 9px;font:inherit}button.a{cursor:pointer}button.a:hover{border-color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #93c5fd}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu)}svg text{fill:#c7d3e8;font-size:9px}
.tag{font-size:10px;border:1px solid var(--ln);border-radius:4px;padding:0 5px;color:var(--mu)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--ac);padding:8px 14px;border-radius:8px;display:none;z-index:9}
.pulse{animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.logo{height:34px;border-radius:4px}footer{grid-column:1/4;background:var(--p);border-top:1px solid var(--ln);padding:6px 14px;display:flex;gap:16px;align-items:center;justify-content:center}nav h4{margin:10px 8px 3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5b6f93}details summary{font-size:11px}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto}header,nav,main,aside,footer{grid-column:1}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto}}
</style></head><body><div id="app">
<header><div><h1>Cairo International Airport (CAI) — Operations Digital Twin</h1><small>Simulation &amp; decision-support prototype · not for operational use</small></div>

<nav id="nav" aria-label="Modules"></nav><main id="main"></main><aside id="side"></aside><footer id="ft"></footer></div><div id="toast" role="status"></div>

function qrOpen(id){const f=S.F.find(x=>x.bags.some(b=>b.id==id)),b=f.bags.find(x=>x.id==id);$('#side').innerHTML=`<h3>Passenger baggage status</h3><div class="card"><div style="text-align:center">${qr(b.tok)}<div class="mu">QR mockup (decorative pattern, not a standards-compliant code). Token: ${b.tok}</div></div><p><b>${b.id}</b><br>${f.dep?'CAI → '+f.apt:f.apt+' → CAI'} · ${f.id}<br>Status: <b>${bagStage(b,f)}</b><br>${S.belt&&f.dep?'Delay notice: sortation fault, bag held':'No exceptions'}<br>Next: ${f.dep?(f.i<3?'Loading':'In flight'):'Reclaim belt'}</p><p class="mu">No personal data shown. Production QR tokens must be unguessable and access-controlled.</p></div>`}
function exp(){const c='sim_time,type,ref,message\n'+S.ev.map(e=>[loc(e.t),e.type,e.f,'"'+e.msg+'"'].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='cai_sim_events.csv';a.click()}
function side(){const f=S.F.find(x=>x.id==sel);if(!f)return'';return`<h3 style="margin:0 0 6px">${f.id} · ${f.al}</h3><div class="card"><div>${f.dep?'CAI → '+f.apt:f.apt+' → CAI'} · ${f.type} · ${f.reg} ${'<span class="tag">illustrative</span>'}</div><div>State: ${bd(f.st,stc(f))}</div><div>Sched ${loc(f.std)} (UTC ${utc(f.std)}) · Est ${eta(f)} · Delay ${f.delay}m</div><div>Stand ${f.stand} · Pax ${f.pax} · Bags ${f.bags.length} sample</div><div>Dispatch: ${f.mx?bd('RESTRICTED','cr'):bd('ready','ok')}</div><div>Constraint: ${f.block||'none'}</div><div class="mu">Route/waypoints: configurable placeholder · Cruise FL350 requested/assigned (illustrative) · simulated clearance only</div></div><h3 style="margin:10px 0 4px">Flight event history</h3>${evlog(10,f.id)}`}
function draw(){$('#nav').innerHTML=NAV.map(n=>`<button class="${view==n[0]?'on':''} ${n[2]?'':'na'}" onclick="setView('${n[0]}')">${n[1]}${n[2]?'':' ·'}</button>`).join('');
const nb=NAV.find(n=>n[0]==view);$('#main').innerHTML=(V[view]?V[view]():`<div class="card"><h3>${nb[1]}</h3><p>Not built in this first pass. The shared state and event bus it will plug into already exist (see Command Center and Weather).</p></div>`)+`<div class="row" style="margin-top:14px"><span class="mu">Technology partners:</span><span style="background:#fff;border-radius:4px;padding:2px"><img class="logo" alt="Schneider Electric" src="${SCH}"></span><img class="logo" alt="AVEVA" src="${AVE}"></div>`;
$('#side').innerHTML=side();$('#src').textContent='DATA: illustrative + simulated · seed '+S.seed;
$('#clk').innerHTML=`<b>Sim ${loc(S.t)} Cairo (UTC+3) · ${utc(S.t)}Z</b> <button class="a pri" onclick="tg()">${play?'Pause':'Play'}</button><button class="a" onclick="if(!play){tick(S);draw()}">Step</button><select onchange="spd=+this.value;rst()" aria-label="Speed">${[1,2,5,10].map(s=>`<option value="${s}" ${s==spd?'selected':''}>${s}×</option>`).join('')}</select><button class="a" onclick="S=makeState(2026);inc=[];tk=[];cmpRes=null;draw();toast('Reset to seed 2026')">Reset</button>`;
$('#role').innerHTML=ROLES.map(r=>`<option ${r==role?'selected':''}>${r}</option>`).join('')}
function tg(){play=!play;rst();draw()}function rst(){clearInterval(timer);if(play)timer=setInterval(()=>{tick(S);if(S.t>=360){play=0;clearInterval(timer)}draw()},1000/spd)}
$('#role').onchange=e=>{role=e.target.value;S.au.unshift({t:S.t,role,m:'Role switched (demo only, not real access control)'});draw()};
$('#srch').oninput=e=>{q=e.target.value;if(view!='fl')view='fl';draw();$('#srch').focus()};
/* v2: grouped nav, fewer KPIs, grouped scenarios, live tracking animation, partner footer */
let PO=0,AC={};const NS='http://www.w3.org/2000/svg',RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const G=[['Operations',['cmd','fl','st']],['Air & Weather',['atc','wx']],['Baggage',['bag','scr']],['Service & Safety',['mx','inc','tix']],['Insight',['an','cfg']]];
$('#ft').innerHTML=`<span class="mu">Technology partners</span><span style="background:#fff;border-radius:4px;padding:2px;display:inline-flex"><img class="logo" alt="Schneider Electric" src="${SCH}"></span><img class="logo" alt="AVEVA" src="${AVE}">`;
function pos(f){const E=f.std+f.delay,p=(a,b)=>Math.max(0,Math.min(1,(S.t-E-a)/(b-a))),i=+f.stand.slice(1)-1,sx=90+i*70,sy=f.stand[0]=='A'?216:191;
if(f.dep){if(f.i<=4)return[sx,sy];if(f.i==5){const q=p(-5,0);return[sx+(110-sx)*q,q<.5?sy+(150-sy)*q*2:150-100*(q-.5)*2]}if(f.i==6)return[110,50];if(f.i==7){const q=p(3,20);return[110+520*q,50-32*q]}return[684,16]}
if(f.i==1)return[690,16];if(f.i==2){const q=p(-12,-1);return[690-390*q,16+34*q]}if(f.i==3){const q=p(-1,2);return[300-190*q,50]}if(f.i==4){const q=p(2,8);return[110+(sx-110)*q,q<.5?50+200*q:150+(sy-150)*(q-.5)*2]}if(f.i==5)return[sx,sy];return null}
function mapSVG(){let s=`<svg viewBox="0 0 700 280" width="100%" role="img" aria-label="Conceptual airport layout with live aircraft tracking"><rect width="700" height="280" fill="#0d1a2e"/><text x="8" y="12">CONCEPTUAL LAYOUT — not an official chart · live tracking</text><text x="420" y="12" style="fill:#60a5fa">▲ departure</text><text x="485" y="12" style="fill:#34d399">▲ arrival</text><text x="545" y="12" style="fill:#f59e0b">▲ constrained</text>
<rect x="30" y="44" width="640" height="12" fill="${S.rwy?'#7f1d1d':'#334155'}"/><text x="36" y="68">RWY (ref. data pending verification)${S.rwy?' — CLOSED':''}</text><rect x="30" y="94" width="640" height="10" fill="#273449"/><text x="36" y="90">RWY (second, conceptual)</text><rect x="60" y="144" width="580" height="6" fill="#1f2c42"/><text x="60" y="140">Taxiway (conceptual)</text><rect x="60" y="236" width="600" height="36" rx="5" fill="#1e3a5f"/><text x="70" y="258" style="font-size:11px">TERMINAL AREA — T1 / T2 / T3 / Seasonal (conceptual)</text>`;
for(const f of S.F){const i=+f.stand.slice(1)-1,x=90+i*70;if(f.stand[0]=='A')s+=`<rect x="${x-14}" y="205" width="28" height="22" fill="none" stroke="#475569"/><text x="${x-8}" y="234">${f.stand}</text>`;else s+=`<rect x="${x-14}" y="180" width="28" height="22" fill="none" stroke="#475569" stroke-dasharray="3"/><text x="${x-8}" y="177">${f.stand}</text>`}
return s+'<g id="ac"></g></svg>'}
function mk(f,a,g){const e=document.createElementNS(NS,'g');e.style.cursor='pointer';e.innerHTML='<polyline fill="none" stroke-width="1" stroke-dasharray="2 3"/><circle r="0" fill="none" stroke-width="1"/><path d="M0-7L2-2L7 1V3L2 1V5L4 7V8L0 7L-4 8V7L-2 5V1L-7 3V1L-2-2Z"/><text></text>';e.onclick=()=>selF(f.id);g.appendChild(e);a.el=e;a.tr_=e.childNodes[0];a.ri=e.childNodes[1];a.pl=e.childNodes[2];a.tx=e.childNodes[3]}
function frame(ts){const g=document.getElementById('ac');if(g){const T={};for(const f of S.F){const p=pos(f);if(p)T[f.id]=[p,f]}
for(const id in AC)if(!T[id])delete AC[id];
for(const id in T){const[p,f]=T[id];let a=AC[id];if(!a)a=AC[id]={x:p[0],y:p[1],h:0,tr:[],n:0};if(!a.el||a.el.parentNode!==g)mk(f,a,g);
const dx=p[0]-a.x,dy=p[1]-a.y,d=Math.hypot(dx,dy);if(RM){a.x=p[0];a.y=p[1]}else{a.x+=dx*.07;a.y+=dy*.07}
if(d>1.2){a.h=Math.atan2(dx,-dy)*57.3;if(++a.n%5==0){a.tr.push(a.x.toFixed(1)+','+a.y.toFixed(1));if(a.tr.length>40)a.tr.shift()}}
const c=f.block?'#f59e0b':f.id==sel?'#ffffff':f.dep?'#60a5fa':'#34d399',ph=RM?0:((ts/1400)+id.length*.13)%1,on=f.id==sel||f.block;
a.tr_.setAttribute('points',a.tr.join(' '));a.tr_.setAttribute('stroke',c);a.pl.setAttribute('fill',c);a.pl.setAttribute('transform',`translate(${a.x},${a.y}) rotate(${a.h})`);
a.ri.setAttribute('cx',a.x);a.ri.setAttribute('cy',a.y);a.ri.setAttribute('r',on?(RM?8:5+ph*12):0);a.ri.setAttribute('stroke',c);a.ri.setAttribute('opacity',RM?1:1-ph);a.tx.setAttribute('x',a.x+10);a.tx.setAttribute('y',a.y+3);a.tx.textContent=f.id}}
requestAnimationFrame(frame)}
function kpiCards(){const k=kpi(S),air=S.F.filter(f=>f.dep?f.i>=7:f.i>=1&&f.i<=3).length,onS=S.F.filter(f=>f.dep?f.i>=1&&f.i<=4:f.i>=5).length;
const c=[['Flights completed',(k.dep+k.arr)+'/14'],['Airborne',air],['On stands',onS],['Held / blocked',k.held],['Avg delay (min)',k.avg],['Open alerts',S.al.filter(a=>!a.res).length]];return`<div class="g k">${c.map(x=>`<div class="card kv"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}
function toolbar(){const g=(n,a)=>`<div class="row" style="margin-bottom:4px"><span class="mu" style="min-width:84px">${n}</span>${a.map(x=>`<button class="a" onclick="act('${x[0]}',${x[2]?`'${x[2]}'`:0})">${x[1]}</button>`).join('')}</div>`;return`<div class="card"><h3>Scenario injection (real state changes + audit)</h3>${g('Weather',[['fog','Fog'],['wind','Strong wind'],['storm','Thunderstorm'],['clear','Clear']])}${g('Airfield',[['rwy','Close runway','Close runway (simulated)?'],['rwyok','Reopen']])}${g('Ground',[['belt','Belt fault'],['beltok','Fix belt'],['tug','No tug'],['tugok','Tugs back']])}${g('ATC / Tech',[['hof','Handoff fail'],['hofok','Handoffs OK'],['defect','Defect MS 985','Report defect on MS 985?']])}</div>`}
function draw(){const nm=k=>NAV.find(n=>n[0]==k)[1],pl=NAV.filter(n=>!n[2]);
$('#nav').innerHTML=G.map(g=>`<h4>${g[0]}</h4>`+g[1].map(k=>`<button class="${view==k?'on':''}" onclick="setView('${k}')">${nm(k)}</button>`).join('')).join('')+`<details ${PO?'open':''} ontoggle="PO=this.open"><summary class="mu" style="padding:8px;cursor:pointer">Planned modules (${pl.length})</summary>${pl.map(n=>`<button class="na ${view==n[0]?'on':''}" onclick="setView('${n[0]}')">${n[1]}</button>`).join('')}</details>`;
const nb=NAV.find(n=>n[0]==view);$('#main').innerHTML=V[view]?V[view]():`<div class="card"><h3>${nb[1]}</h3><p>Not built in this first pass. The shared state and event bus it will plug into already exist.</p></div>`;
$('#side').innerHTML=side();$('#src').textContent='DATA: illustrative + simulated · seed '+S.seed;
$('#clk').innerHTML=`<b>Sim ${loc(S.t)} Cairo (UTC+3) · ${utc(S.t)}Z</b> <button class="a pri" onclick="tg()">${play?'Pause':'Play'}</button><button class="a" onclick="if(!play){tick(S);draw()}">Step</button><select onchange="spd=+this.value;rst()" aria-label="Speed">${[1,2,5,10].map(s=>`<option value="${s}" ${s==spd?'selected':''}>${s}×</option>`).join('')}</select><button class="a" onclick="S=makeState(2026);inc=[];tk=[];cmpRes=null;AC={};draw();toast('Reset to seed 2026')">Reset</button>`;
$('#role').innerHTML=ROLES.map(r=>`<option ${r==role?'selected':''}>${r}</option>`).join('')}
draw();requestAnimationFrame(frame);
</script></body></html>
